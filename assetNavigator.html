async function loadAssetDetail(assetId) {
  const coreQ = `{
    assets(where: { id: { eq: "${assetId}" } }, limit: 1) {
      id displayName fullName createdOn modifiedOn
      type { id name }
      status { name }
      domain { id name }
      stringAttributes(limit: ${ATTRS_PER_PAGE}) { type { name } stringValue }
      booleanAttributes(limit: ${ATTRS_PER_PAGE}) { type { name } booleanValue }
      numericAttributes(limit: ${ATTRS_PER_PAGE}) { type { name } numericValue }
      dateAttributes(limit: ${ATTRS_PER_PAGE}) { type { name } dateValue }
      multiValueAttributes(limit: ${ATTRS_PER_PAGE}) { type { name } stringValues }
      tags { name }
    }
  }`;

  const outRelP = pagedGqlCustom(
    (limit, offset) => `{
      assets(where: { id: { eq: "${assetId}" } }, limit: 1) {
        outgoingRelations(limit: ${limit}, offset: ${offset}) {
          id type { id role corole source { name } target { name } }
          target { id displayName type { name } }
        }
      }
    }`,
    data => ((data.assets || [])[0] || {}).outgoingRelations || [],
    DETAIL_REL_PAGE,
  );

  const inRelP = pagedGqlCustom(
    (limit, offset) => `{
      assets(where: { id: { eq: "${assetId}" } }, limit: 1) {
        incomingRelations(limit: ${limit}, offset: ${offset}) {
          id type { id role corole source { name } target { name } }
          source { id displayName type { name } }
        }
      }
    }`,
    data => ((data.assets || [])[0] || {}).incomingRelations || [],
    DETAIL_REL_PAGE,
  );

  const respsP = pagedRest(
    `/rest/2.0/responsibilities?resourceIds=${encodeURIComponent(assetId)}&includeInherited=true`
  ).catch(() => []);

  const [gqlRes, outgoingRelations, incomingRelations, allResps] = await Promise.all([
    gql(coreQ), outRelP, inRelP, respsP,
  ]);

  const asset = (gqlRes.assets || [])[0];
  if (!asset) throw new Error('Asset not found.');
  asset.outgoingRelations = outgoingRelations;
  asset.incomingRelations = incomingRelations;

  if (asset.domain && asset.domain.id) {
    try {
      const domainRest = await api(`/rest/2.0/domains/${encodeURIComponent(asset.domain.id)}`);
      if (domainRest && domainRest.community) {
        asset.domain.community = { id: domainRest.community.id, name: domainRest.community.name };
      }
    } catch {}
  }

  const userIds = new Set();
  const groupIds = new Set();
  for (const r of allResps) {
    if (!r.owner || !r.owner.id) continue;
    if (r.owner.resourceType === 'User') userIds.add(r.owner.id);
    else if (r.owner.resourceType === 'UserGroup') groupIds.add(r.owner.id);
  }
  const userMap = new Map();
  if (userIds.size) {
    const ids = Array.from(userIds);
    const CHUNK = 100;
    for (let i = 0; i < ids.length; i += CHUNK) {
      const params = ids.slice(i, i + CHUNK).map(id => `userId=${encodeURIComponent(id)}`).join('&');
      try {
        const users = await pagedRest(`/rest/2.0/users?${params}`);
        for (const u of users) userMap.set(u.id, u);
      } catch {}
    }
  }
  const groupMap = new Map();
  if (groupIds.size) {
    await Promise.all(Array.from(groupIds).map(async id => {
      try {
        const g = await api(`/rest/2.0/userGroups/${encodeURIComponent(id)}`);
        if (g && g.id) groupMap.set(g.id, g);
      } catch {}
    }));
  }

  return { asset, responsibilities: allResps, userMap, groupMap };
}

function collectAttributes(asset) {
  const out = [];
  const isHidden = name => /^category$/i.test((name || '').trim());
  for (const sa of (asset.stringAttributes || [])) {
    if (sa.stringValue == null || sa.stringValue === '') continue;
    const name = (sa.type && sa.type.name) || 'String';
    if (isHidden(name)) continue;
    out.push({
      name,
      value: sa.stringValue,
      html: looksLikeHtml(sa.stringValue),
    });
  }
  for (const na of (asset.numericAttributes || [])) {
    if (na.numericValue == null) continue;
    const name = (na.type && na.type.name) || 'Number';
    if (isHidden(name)) continue;
    out.push({ name, value: String(na.numericValue), html: false });
  }
  for (const ba of (asset.booleanAttributes || [])) {
    if (ba.booleanValue == null) continue;
    const name = (ba.type && ba.type.name) || 'Boolean';
    if (isHidden(name)) continue;
    out.push({ name, value: ba.booleanValue ? 'Yes' : 'No', html: false });
  }
  for (const da of (asset.dateAttributes || [])) {
    if (da.dateValue == null) continue;
    const name = (da.type && da.type.name) || 'Date';
    if (isHidden(name)) continue;
    out.push({ name, value: formatDate(da.dateValue), html: false });
  }
  out.sort((a, b) => {
    const aDesc = /description/i.test(a.name) ? 0 : 1;
    const bDesc = /description/i.test(b.name) ? 0 : 1;
    if (aDesc !== bDesc) return aDesc - bDesc;
    return a.name.localeCompare(b.name);
  });
  return out;
}

function groupRelations(relations, otherKey) {
  const groups = new Map();
  for (const r of relations) {
    const role = (r.type && r.type.role) || 'related to';
    const other = r[otherKey];
    if (!other) continue;
    const otherType = (other.type && other.type.name) || 'Asset';
    const labelKey = role + '||' + otherType;
    if (!groups.has(labelKey)) {
      groups.set(labelKey, {
        label: { role, sourceType: otherType, targetType: otherType },
        items: [],
      });
    }
    groups.get(labelKey).items.push({ other });
  }
  const ordered = new Map();
  const keys = Array.from(groups.keys()).sort();
  for (const k of keys) {
    const g = groups.get(k);
    ordered.set(g.label, g.items);
  }
  return ordered;
}

function buildRelationDiagramSection(asset) {
  const incoming = asset.incomingRelations || [];
  const outgoing = asset.outgoingRelations || [];
  const total = incoming.length + outgoing.length;
  if (!total) return '';

  const currentNode = {
    id: asset.id,
    displayName: asset.displayName || asset.fullName || '(unnamed)',
    type: asset.type || {},
  };
  const incomingRows = incoming.filter(relation => relation.source);
  const outgoingRows = outgoing.filter(relation => relation.target);
  if (!incomingRows.length && !outgoingRows.length) return '';

  let html = '<div class="section span-diagram full-width relation-diagram-section" id="relationDiagramSection">';
  html += `<h3>Relation Diagram <span class="count">${total}</span></h3>`;
  html += '<div class="relation-diagram-toolbar">';
  html += '<div class="diagram-key" aria-hidden="true"><span class="diagram-key-item incoming">Incoming</span><span class="diagram-key-item outgoing">Outgoing</span></div>';
  html += '<div class="diagram-toggles" aria-label="Relation diagram labels">';
  html += '<label class="diagram-toggle"><input type="checkbox" data-diagram-toggle="role"> Role</label>';
  html += '<label class="diagram-toggle"><input type="checkbox" data-diagram-toggle="corole"> CoRole</label>';
  html += '</div></div>';
  html += `<div class="relation-diagram" role="group" aria-label="Relation diagram for ${escapeAttr(currentNode.displayName)}">`;

  // SVG arrow overlay (filled in by layoutRelationDiagram)
  html += '<svg class="diagram-svg-overlay" aria-hidden="true">';
  html += '<defs>';
  html += '<marker id="diagramArrowIncoming" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">';
  html += '<path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>';
  html += '</marker>';
  html += '<marker id="diagramArrowOutgoing" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">';
  html += '<path d="M0,0 L10,5 L0,10 z" fill="var(--gold)"/>';
  html += '</marker>';
  html += '</defs>';
  html += '<g class="diagram-paths"></g>';
  html += '</svg>';

  // Incoming column (grouped, with per-group show-more)
  const incomingFlat = [];
  const incomingGroups = buildDiagramGroups(incomingRows, 'source', incomingFlat);
  html += `<div class="diagram-column incoming"><div class="diagram-column-title">Incoming ${incomingRows.length ? `<span class="count">${incomingRows.length}</span>` : ''}</div>`;
  if (incomingGroups.length) {
    for (const g of incomingGroups) {
      html += renderDiagramGroup(g, 'incoming');
    }
  } else {
    html += '<div class="diagram-empty">No incoming relations</div>';
  }
  html += '</div>';

  // Center
  html += '<div class="diagram-center">';
  html += '<div class="diagram-center-label">Current Asset</div>';
  html += buildDiagramNode(currentNode, true);
  html += '</div>';

  // Outgoing column (grouped, with per-group show-more)
  const outgoingFlat = [];
  const outgoingGroups = buildDiagramGroups(outgoingRows, 'target', outgoingFlat);
  html += `<div class="diagram-column outgoing"><div class="diagram-column-title">Outgoing ${outgoingRows.length ? `<span class="count">${outgoingRows.length}</span>` : ''}</div>`;
  if (outgoingGroups.length) {
    for (const g of outgoingGroups) {
      html += renderDiagramGroup(g, 'outgoing');
    }
  } else {
    html += '<div class="diagram-empty">No outgoing relations</div>';
  }
  html += '</div>';

  // Edge labels layer (positioned absolutely over arrows)
  html += '<div class="diagram-edge-labels" aria-hidden="true">';
  incomingFlat.forEach((relation, i) => {
    const role = getRelationRoleText(relation, 'role');
    const corole = getRelationRoleText(relation, 'corole');
    if (role) html += `<span class="diagram-edge-label role" data-edge-id="in-${i}" title="${escapeAttr(role)}">Role: ${escapeHtml(role)}</span>`;
    if (corole) html += `<span class="diagram-edge-label corole" data-edge-id="in-${i}" title="${escapeAttr(corole)}">CoRole: ${escapeHtml(corole)}</span>`;
  });
  outgoingFlat.forEach((relation, i) => {
    const role = getRelationRoleText(relation, 'role');
    const corole = getRelationRoleText(relation, 'corole');
    if (role) html += `<span class="diagram-edge-label role" data-edge-id="out-${i}" title="${escapeAttr(role)}">Role: ${escapeHtml(role)}</span>`;
    if (corole) html += `<span class="diagram-edge-label corole" data-edge-id="out-${i}" title="${escapeAttr(corole)}">CoRole: ${escapeHtml(corole)}</span>`;
  });
  html += '</div>';

  html += '</div></div>';
  return html;
}

const DIAGRAM_GROUP_PREVIEW = 5;

// Group relations for the diagram while preserving the flat iteration order so
// edge IDs (in-${i} / out-${i}) line up with the existing arrow + label layout.
function buildDiagramGroups(relations, otherKey, flatOut) {
  const groups = new Map();
  relations.forEach((relation, flatIndex) => {
    flatOut.push(relation);
    const other = relation[otherKey];
    if (!other) return;
    const role = (relation.type && relation.type.role) || 'related to';
    const otherType = (other.type && other.type.name) || 'Asset';
    const key = role + '||' + otherType;
    if (!groups.has(key)) {
      groups.set(key, { role, otherType, items: [] });
    }
    groups.get(key).items.push({ other, flatIndex });
  });
  // Sort: largest groups first, then alphabetic by role for stability.
  return Array.from(groups.values()).sort((a, b) =>
    b.items.length - a.items.length || a.role.localeCompare(b.role)
  );
}

function renderDiagramGroup(group, direction) {
  const arrow = direction === 'incoming' ? '→' : '→';
  const headerInner = direction === 'incoming'
    ? `<span class="other-type">${escapeHtml(group.otherType)}</span> <span class="arrow">${arrow}</span> <span class="role">${escapeHtml(group.role)}</span>`
    : `<span class="role">${escapeHtml(group.role)}</span> <span class="arrow">${arrow}</span> <span class="other-type">${escapeHtml(group.otherType)}</span>`;
  const showMore = group.items.length > DIAGRAM_GROUP_PREVIEW;
  let h = `<div class="diagram-group"${showMore ? ' data-preview="' + DIAGRAM_GROUP_PREVIEW + '"' : ''}>`;
  h += `<button type="button" class="diagram-group-header" aria-expanded="true">`;
  h += `<span class="chev" aria-hidden="true">▾</span>${headerInner}<span class="count">${group.items.length}</span>`;
  h += `</button>`;
  h += `<div class="diagram-group-nodes">`;
  group.items.forEach((item, idx) => {
    const edgeId = `${direction === 'incoming' ? 'in' : 'out'}-${item.flatIndex}`;
    const hidden = showMore && idx >= DIAGRAM_GROUP_PREVIEW;
    h += buildDiagramEdgeNode(item.other, direction, edgeId, hidden);
  });
  if (showMore) {
    const remaining = group.items.length - DIAGRAM_GROUP_PREVIEW;
    h += `<button type="button" class="diagram-group-more" data-show-more>Show ${remaining} more</button>`;
  }
  h += `</div></div>`;
  return h;
}

function buildDiagramEdgeNode(node, direction, edgeId, hidden) {
  const name = node.displayName || node.fullName || '(unnamed)';
  const typeName = (node.type && node.type.name) || 'Asset';
  const inner = `<span class="diagram-node-name">${escapeHtml(name)}</span><span class="diagram-node-type">${escapeHtml(typeName)}</span>`;
  const dataAttrs = `data-direction="${direction}" data-edge-id="${edgeId}"${hidden ? ' hidden' : ''}`;
  if (!node.id) {
    return `<div class="diagram-node diagram-edge-node" ${dataAttrs} title="${escapeAttr(name)}">${inner}</div>`;
  }
  return `<button type="button" class="diagram-node diagram-edge-node" ${dataAttrs} data-asset-id="${escapeAttr(node.id)}" title="${escapeAttr(name)}">${inner}</button>`;
}

function buildDiagramNode(node, isCurrent) {
  const name = node.displayName || node.fullName || '(unnamed)';
  const typeName = (node.type && node.type.name) || 'Asset';
  const inner = `<span class="diagram-node-name">${escapeHtml(name)}</span><span class="diagram-node-type">${escapeHtml(typeName)}${isCurrent ? ' · Selected' : ''}</span>`;
  if (isCurrent || !node.id) {
    return `<div class="diagram-node${isCurrent ? ' current' : ''}" title="${escapeAttr(name)}">${inner}</div>`;
  }
  return `<button type="button" class="diagram-node" data-asset-id="${escapeAttr(node.id)}" title="${escapeAttr(name)}">${inner}</button>`;
}

function getRelationRoleText(relation, field) {
  const type = relation.type || {};
  if (field === 'corole') return type.corole || type.coRole || '';
  return type.role || '';
}

function setupRelationDiagramControls(content) {
  const section = content.querySelector('#relationDiagramSection');
  if (!section) return;
  section.querySelectorAll('[data-diagram-toggle]').forEach(input => {
    input.checked = false;
    input.addEventListener('change', () => {
      section.classList.toggle(`show-${input.dataset.diagramToggle}`, input.checked);
      const d = section.querySelector('.relation-diagram');
      if (d) layoutRelationDiagram(d);
    });
  });

  const diagram = section.querySelector('.relation-diagram');
  if (!diagram) return;

  const layout = () => layoutRelationDiagram(diagram);

  // Group collapse + show-more controls
  diagram.addEventListener('click', (e) => {
    const moreBtn = e.target.closest('.diagram-group-more');
    if (moreBtn) {
      const group = moreBtn.closest('.diagram-group');
      if (group) {
        group.querySelectorAll('.diagram-edge-node[hidden]').forEach(n => n.removeAttribute('hidden'));
        moreBtn.remove();
        requestAnimationFrame(layout);
      }
      return;
    }
    const header = e.target.closest('.diagram-group-header');
    if (header) {
      const group = header.closest('.diagram-group');
      if (group) {
        const collapsed = group.classList.toggle('collapsed');
        header.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
        requestAnimationFrame(layout);
      }
    }
  });

  // Initial layout (after fonts/layout settle)
  requestAnimationFrame(layout);
  setTimeout(layout, 60);

  if (typeof ResizeObserver !== 'undefined') {
    const ro = new ResizeObserver(() => layout());
    ro.observe(diagram);
    diagram.querySelectorAll('.diagram-node').forEach(n => ro.observe(n));
  }
  diagram.addEventListener('scroll', layout, { passive: true });
  window.addEventListener('resize', layout);
}

function layoutRelationDiagram(diagram) {
  const svg = diagram.querySelector('.diagram-svg-overlay');
  const pathsGroup = svg && svg.querySelector('.diagram-paths');
  const labelsLayer = diagram.querySelector('.diagram-edge-labels');
  const current = diagram.querySelector('.diagram-node.current');
  if (!svg || !pathsGroup || !labelsLayer || !current) return;

  const w = diagram.scrollWidth;
  const h = diagram.scrollHeight;
  svg.setAttribute('width', w);
  svg.setAttribute('height', h);
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  if (labelsLayer) {
    labelsLayer.style.width = w + 'px';
    labelsLayer.style.height = h + 'px';
  }

  const containerRect = diagram.getBoundingClientRect();
  const offsetX = -containerRect.left + diagram.scrollLeft;
  const offsetY = -containerRect.top + diagram.scrollTop;
  const rectFor = el => {
    const r = el.getBoundingClientRect();
    return {
      left: r.left + offsetX,
      right: r.right + offsetX,
      top: r.top + offsetY,
      bottom: r.bottom + offsetY,
      width: r.width,
      height: r.height,
      cy: r.top + offsetY + r.height / 2,
    };
  };

  const cur = rectFor(current);
  const currentLeft = { x: cur.left, y: cur.cy };
  const currentRight = { x: cur.right, y: cur.cy };

  // Clear previous paths
  while (pathsGroup.firstChild) pathsGroup.removeChild(pathsGroup.firstChild);

  const visibleEdgeIds = new Set();
  diagram.querySelectorAll('.diagram-edge-node').forEach(node => {
    // Skip nodes inside a collapsed group or hidden by [hidden] attr.
    if (node.offsetParent === null || node.hidden) return;
    visibleEdgeIds.add(node.dataset.edgeId);
    const dir = node.dataset.direction;
    const r = rectFor(node);
    let p1, p2, dirClass, markerId;
    if (dir === 'incoming') {
      // Arrow from other.right -> current.left
      p1 = { x: r.right, y: r.cy };
      p2 = currentLeft;
      dirClass = 'incoming';
      markerId = 'diagramArrowIncoming';
    } else {
      // Arrow from current.right -> other.left
      p1 = currentRight;
      p2 = { x: r.left, y: r.cy };
      dirClass = 'outgoing';
      markerId = 'diagramArrowOutgoing';
    }

    const dx = Math.max(40, Math.abs(p2.x - p1.x) * 0.55);
    const c1 = { x: p1.x + dx, y: p1.y };
    const c2 = { x: p2.x - dx, y: p2.y };
    const d = `M ${p1.x} ${p1.y} C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${p2.x} ${p2.y}`;

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    path.setAttribute('class', `diagram-arrow ${dirClass}`);
    path.setAttribute('marker-end', `url(#${markerId})`);
    pathsGroup.appendChild(path);

    // Position labels at curve midpoint (cubic bezier midpoint at t=0.5)
    const mx = (p1.x + 3 * c1.x + 3 * c2.x + p2.x) / 8;
    const my = (p1.y + 3 * c1.y + 3 * c2.y + p2.y) / 8;
    const edgeId = node.dataset.edgeId;
    const labels = labelsLayer.querySelectorAll(`[data-edge-id="${edgeId}"]`);
    const visible = Array.from(labels).filter(l => getComputedStyle(l).display !== 'none');
    const heights = visible.map(l => l.offsetHeight || 16);
    const totalH = heights.reduce((s, h) => s + h, 0) + Math.max(0, visible.length - 1) * 2;
    let cy = my - totalH / 2;
    visible.forEach((label, i) => {
      label.style.left = mx + 'px';
      label.style.top = (cy + heights[i] / 2) + 'px';
      cy += heights[i] + 2;
    });
    // Hidden labels still need positioning so they're correct when shown
    Array.from(labels).filter(l => !visible.includes(l)).forEach(label => {
      label.style.left = mx + 'px';
      label.style.top = my + 'px';
    });
  });

  // Hide labels whose edge node is currently not visible (collapsed / show-more).
  labelsLayer.querySelectorAll('.diagram-edge-label').forEach(label => {
    const id = label.getAttribute('data-edge-id');
    label.style.visibility = visibleEdgeIds.has(id) ? '' : 'hidden';
  });
}

function buildCustomizePanel() {
  const prefs = getEffectivePrefs();
  const body = document.getElementById('panelBody');

  // Theme swatches HTML
  let themeHtml = '';
  for (const branch of BRANCHES) {
    const bt = THEMES.filter(t => t.branch === branch);
    if (!bt.length) continue;
    themeHtml += `<div class="branch-label">${esc(branch)}</div><div class="theme-grid">`;
    for (const t of bt) {
      const ac = t.vars['--accent'] || '#666';
      const isActive = t.id === prefs.themeId;
      themeHtml += `<button type="button" class="theme-swatch${isActive ? ' active' : ''}" data-theme-id="${esc(t.id)}" data-mode="${esc(t.mode)}" role="radio" aria-checked="${isActive ? 'true' : 'false'}" aria-label="${esc(t.label)} (${esc(t.mode)} mode)" style="background:${esc(t.heroGrad)};${isActive ? `border-color:${ac};` : ''}"><span class="swatch-mode-tag" aria-hidden="true">${t.mode}</span><span class="swatch-label" aria-hidden="true">${esc(t.label)}</span></button>`;
    }
    themeHtml += '</div>';
  }

  // Font selectors HTML
  const fontBodyOptions = FONT_BODY_OPTIONS.map(f =>
    `<option value="${esc(f.id)}"${f.id === prefs.fontBody ? ' selected' : ''}>${esc(f.label)}</option>`
  ).join('');
  const fontDisplayOptions = FONT_DISPLAY_OPTIONS.map(f =>
    `<option value="${esc(f.id)}"${f.id === prefs.fontDisplay ? ' selected' : ''}>${esc(f.label)}</option>`
  ).join('');

  body.innerHTML = `
    <div class="panel-section">
      <div class="panel-label" id="themeBranchLabel">Theme · Branch &amp; Mode</div>
      <div id="themePanelSwatches" role="radiogroup" aria-labelledby="themeBranchLabel">${themeHtml}</div>
    </div>
    <div class="panel-section">
      <div class="panel-label">Typography</div>
      <label for="cfgFontBody" class="panel-label" style="font-size:9px;margin-bottom:4px">Body Font</label>
      <select id="cfgFontBody" class="panel-select">${fontBodyOptions}</select>
      <div class="panel-hint">Body text, descriptions, search inputs.</div>
      <label for="cfgFontDisplay" class="panel-label" style="font-size:9px;margin-bottom:4px;margin-top:8px">Display Font</label>
      <select id="cfgFontDisplay" class="panel-select">${fontDisplayOptions}</select>
      <div class="panel-hint">Titles, labels, badges, buttons.</div>
      <div class="scale-row" style="margin-top:14px">
        <label for="cfgFontScale" class="panel-label" style="margin-bottom:0">Size Scale</label>
        <span class="scale-value" aria-hidden="true">×<span id="cfgFontScaleLabel">${(parseFloat(prefs.fontScale) || 1).toFixed(2)}</span></span>
      </div>
      <input id="cfgFontScale" type="range" min="0.85" max="1.5" step="0.05" value="${parseFloat(prefs.fontScale) || 1}" class="scale-slider">
      <div class="scale-marks"><span>Compact</span><span>Default</span><span>Large</span></div>
    </div>
    <div class="panel-section">
      <button class="btn-panel-reset" id="resetPrefs"><span aria-hidden="true">↩</span> Reset to Defaults</button>
    </div>
  `;
}

function setupCustomizePanel() {
  const panel = document.getElementById('customizePanel');
  const backdrop = document.getElementById('panelBackdrop');
  const openBtn = document.getElementById('customizeBtn');
  const closeBtn = document.getElementById('panelClose');
  let lastFocus = null;

  function openPanel() {
    lastFocus = document.activeElement;
    panel.hidden = false; backdrop.hidden = false;
    requestAnimationFrame(() => panel.classList.add('open'));
    openBtn.setAttribute('aria-expanded', 'true');
    setTimeout(() => closeBtn.focus(), 50);
  }
  function closePanel() {
    panel.classList.remove('open');
    backdrop.hidden = true;
    openBtn.setAttribute('aria-expanded', 'false');
    panel.addEventListener('transitionend', () => panel.hidden = true, { once: true });
    if (lastFocus && typeof lastFocus.focus === 'function') lastFocus.focus();
  }

  openBtn.addEventListener('click', openPanel);
  closeBtn.addEventListener('click', closePanel);
  backdrop.addEventListener('click', closePanel);
  panel.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); closePanel(); return; }
    if (e.key === 'Tab') {
      const focusables = panel.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])');
      if (!focusables.length) return;
      const first = focusables[0], last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  // Theme swatch click & keyboard
  const swatchHost = document.getElementById('themePanelSwatches');
  function selectTheme(sw) {
    if (!sw) return;
    const tid = sw.dataset.themeId;
    const prefs = getUserPrefs(); prefs.themeId = tid; saveUserPrefs(prefs);
    applyTheme(tid);
    document.querySelectorAll('.theme-swatch').forEach(s => {
      const isA = s.dataset.themeId === tid;
      s.classList.toggle('active', isA);
      s.setAttribute('aria-checked', isA ? 'true' : 'false');
      s.style.borderColor = isA ? (getTheme(tid).vars['--accent'] || '') : '';
    });
    // Refresh shield SVG to new accent
    const t = getTheme(tid);
    document.getElementById('brandShield').innerHTML = shieldSVG(32, t.vars['--accent'] || '#1B6FBA', 'rgba(0,0,0,.18)', t.vars['--gold'] || '#C8A84B');
  }
  swatchHost.addEventListener('click', (e) => {
    const sw = e.target.closest('[data-theme-id]'); if (!sw) return;
    selectTheme(sw);
  });
  swatchHost.addEventListener('keydown', (e) => {
    const swatches = [...document.querySelectorAll('.theme-swatch')];
    const idx = swatches.indexOf(document.activeElement);
    if (idx < 0) return;
    let next = -1;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next = (idx + 1) % swatches.length;
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') next = (idx - 1 + swatches.length) % swatches.length;
    else if (e.key === 'Home') next = 0;
    else if (e.key === 'End')  next = swatches.length - 1;
    else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); selectTheme(swatches[idx]); return; }
    if (next >= 0) { e.preventDefault(); swatches[next].focus(); selectTheme(swatches[next]); }
  });

  // Fonts
  document.getElementById('cfgFontBody').addEventListener('change', (e) => {
    const prefs = getUserPrefs(); prefs.fontBody = e.target.value; saveUserPrefs(prefs);
    applyFontConfig(getEffectivePrefs());
  });
  document.getElementById('cfgFontDisplay').addEventListener('change', (e) => {
    const prefs = getUserPrefs(); prefs.fontDisplay = e.target.value; saveUserPrefs(prefs);
    applyFontConfig(getEffectivePrefs());
  });
  const scaleEl = document.getElementById('cfgFontScale');
  const scaleLabel = document.getElementById('cfgFontScaleLabel');
  scaleEl.addEventListener('input', (e) => {
    const v = parseFloat(e.target.value) || 1;
    scaleLabel.textContent = v.toFixed(2);
    const prefs = getUserPrefs(); prefs.fontScale = v; saveUserPrefs(prefs);
    applyFontConfig(getEffectivePrefs());
  });

  // Reset
  document.getElementById('resetPrefs').addEventListener('click', () => {
    try { localStorage.removeItem(USER_PREFS_KEY); } catch {}
    location.reload();
  });
}

// ============================================================================
// Run
// ============================================================================
window.addEventListener('hashchange', () => {
  const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  const id = hash.get('asset');
  if (id && id !== state.selectedAssetId) selectAsset(id);
});

bootstrap();
</script>
